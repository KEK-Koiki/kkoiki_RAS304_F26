<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="600" viewBox="0 0 1230 600"><rect width="1230" height="600" rx="18" fill="#f0f5f5"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#147b80"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="45" fill="#142c3c" font-size="25" font-weight="700">Two-motor encoder subsystem</text><text x="40" y="76" fill="#526b75" font-size="17">Elijah Koiki / Team 103 / Revision B alignment / 28 Oct 2026</text><rect x="40" y="105" width="240" height="125" rx="10" fill="white" stroke="#bbced1"/><text x="56" y="135" font-size="16" fill="#147b80" font-weight="700">MOTOR SHAFTS</text><text x="56" y="169" font-size="17" fill="#142c3c">2 DC motors, &lt;=12 V</text><text x="56" y="199" font-size="14" fill="#526b75">Disks + A/B sensor mounts</text><rect x="330" y="105" width="260" height="125" rx="10" fill="white" stroke="#bbced1"/><text x="346" y="135" font-size="16" fill="#147b80" font-weight="700">OPTICAL SENSING</text><text x="346" y="169" font-size="17" fill="#142c3c">4 x TCST2103</text><text x="346" y="199" font-size="14" fill="#526b75">E1A / E1B / E2A / E2B</text><rect x="640" y="105" width="260" height="125" rx="10" fill="white" stroke="#bbced1"/><text x="656" y="135" font-size="16" fill="#147b80" font-weight="700">ANALOG FRONT END</text><text x="656" y="169" font-size="17" fill="#142c3c">4.7k / 1nF RC + MCP6004</text><text x="656" y="199" font-size="14" fill="#526b75">Nominal gain 1.5</text><rect x="950" y="105" width="240" height="125" rx="10" fill="white" stroke="#bbced1"/><text x="966" y="135" font-size="16" fill="#147b80" font-weight="700">EDGE CONDITIONING</text><text x="966" y="169" font-size="17" fill="#142c3c">SN74HC14</text><text x="966" y="199" font-size="14" fill="#526b75">4 Schmitt inverter gates</text><rect x="640" y="330" width="260" height="140" rx="10" fill="white" stroke="#bbced1"/><text x="656" y="360" font-size="16" fill="#147b80" font-weight="700">PIC18F57Q43 NANO</text><text x="656" y="394" font-size="17" fill="#142c3c">RB0 / RB1 / RB2 / RB3</text><text x="656" y="424" font-size="14" fill="#526b75">Quadrature counts + timing</text><rect x="330" y="330" width="260" height="140" rx="10" fill="white" stroke="#bbced1"/><text x="346" y="360" font-size="16" fill="#147b80" font-weight="700">PROPOSED TEAM LINK</text><text x="346" y="394" font-size="17" fill="#142c3c">RC6 TX / RC7 RX</text><text x="346" y="424" font-size="14" fill="#526b75">Connor: main board / PC</text><rect x="40" y="330" width="240" height="140" rx="10" fill="white" stroke="#bbced1"/><text x="56" y="360" font-size="16" fill="#147b80" font-weight="700">SYSTEM CONTROL</text><text x="56" y="394" font-size="17" fill="#142c3c">Main + motor driver</text><text x="56" y="424" font-size="14" fill="#526b75">Walker: motor actuation</text><rect x="950" y="330" width="240" height="140" rx="10" fill="white" stroke="#bbced1"/><text x="966" y="360" font-size="16" fill="#147b80" font-weight="700">LOCAL POWER</text><text x="966" y="394" font-size="17" fill="#142c3c">9-12 V -> fuse -> L7805</text><text x="966" y="424" font-size="14" fill="#526b75">Regulated +5 V / common GND</text><polyline points="280,165 330,165" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><polyline points="590,165 640,165" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><polyline points="900,165 950,165" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><polyline points="1070,230 1070,278 770,278 770,330" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><polyline points="640,400 590,400" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><polyline points="330,400 280,400" fill="none" stroke="#147b80" stroke-width="3" marker-end="url(#a)"/><text x="40" y="515" font-size="16" fill="#526b75">+5 V powers sensor emitters, amplifier, Schmitt logic and Nano; motor drive power stays on the driver board.</text><text x="40" y="543" font-size="16" fill="#526b75">A/B sensors are offset by 90 electrical degrees per motor. Mounting and ribbon allocation remain pending.</text><text x="40" y="571" font-size="16" fill="#526b75">Signal chain shown four times in the schematic. UART is a proposed point-to-point interface, not a shared multi-driver bus.</text></g></svg>
