site_name: Elijah Koiki · RAS304
site_description: Team 103 motor encoder subsystem — design, components, schematics and verification.
site_url: https://kek-koiki.github.io/kkoiki_RAS304_F26/
repo_url: https://github.com/KEK-Koiki/kkoiki_RAS304_F26
repo_name: KEK-Koiki / kkoiki_RAS304_F26
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: custom
    accent: custom
  font: false
  logo: static/encoder-mark.svg
  favicon: static/logo304.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - content.action.edit
    - search.highlight
nav:
  - Overview: index.md
  - Block Diagram: 01-Block-Diagram/Block-Diagram.md
  - Component Selection: 02-Component-Selection/Component-Selection.md
  - BOM: 03-BOM/BOM.md
  - Schematic: 04-Schematic/schematic.md
  - Power Budget: 05-Power-Budget/Power-Budget.md
  - Review & Resources: Appendix/index.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
plugins:
  - search
  - glightbox
extra_css:
  - stylesheets/extra.css
exclude_docs: |
  static/node_modules/
  static/package*.json
  Appendix/another-subfile.md
  Appendix/basic-markdown-examples.md
  Appendix/charts.md
  Appendix/esp-32-table.md
  04-Schematic/dummyZip.zip
  04-Schematic/ExampleSchematic.pdf
  04-Schematic/Screenshot.png
  05-Power-Budget/PowerBudgetExample.pdf
  05-Power-Budget/PowerBudgetExample.xlsx
  05-Power-Budget/power-budject-new
copyright: Copyright &copy; 2026 Elijah Koiki · Team 103 · Arizona State University
extra:
  generator: false
